name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Install app dependencies
        run: cd app && npm install --ignore-scripts

      - name: Typecheck
        run: cd app && npx tsc -p tsconfig.json --noEmit

      - name: Run frontend tests
        run: cd app && npx vitest run

      - name: Run contract logic tests
        run: npx vitest run --config vitest.config.ts tests/

      - name: Build frontend
        run: cd app && npx vite build
